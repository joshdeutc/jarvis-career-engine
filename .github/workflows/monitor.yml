name: ATS Job Watcher & LLM Filtering

on:
  schedule:
    # Exécution du lundi au vendredi à 8h, 12h et 17h UTC (pics de publication selon le modèle de Poisson)
    - cron: '0 8,12,17 * * 1-5'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'interface GitHub

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du pipeline de veille ATS
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
        run: |
          python -m src.main

      - name: Persistance de la base de données asymétrique
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): synchronisation de l'état dans seen_jobs.json"
          file_pattern: 'seen_jobs.json'
